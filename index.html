<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Code Pro (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        /* ตัวแปรสีพื้นฐาน (รองรับ Dark Mode) */
        :root {
            --bg-body: url('https://lh3.googleusercontent.com/d/1Xz0dyDpDXotdZRF6QgvYzWuq2NUHadfR');
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1f2937;
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-border: #d1d5db;
        }

        /* โหมดมืด (Dark Mode) */
        body.dark-mode {
            --glass-bg: rgba(31, 41, 55, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --input-bg: rgba(17, 24, 39, 0.7);
            --input-border: #4b5563;
        }

        body { 
            background-image: var(--bg-body);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-main); font-family: sans-serif; 
            transition: color 0.3s;
        }

        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
            padding: 2rem; 
            transition: background 0.3s, border 0.3s;
        }

        nav { background: var(--glass-bg) !important; backdrop-filter: blur(8px); border: 1px solid var(--glass-border); transition: background 0.3s; }
        
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s; }
        
        .input-field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); }
        .input-field:focus { border-color: #8b5cf6; outline: none; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* ปุ่มไมค์ */
        .mic-btn { position: absolute; right: 10px; top: 10px; color: #8b5cf6; cursor: pointer; transition: 0.2s; }
        .mic-btn:hover { color: #6d28d9; transform: scale(1.1); }
        .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="pageApp" class="page-section active flex-grow p-4 md:p-8">
        <nav class="flex justify-between items-center mb-8 p-4 rounded-xl shadow">
            <div class="font-bold text-xl flex items-center">
                <i class="fas fa-qrcode text-purple-600 mr-2"></i>QR Pro
                <!-- ปุ่มสลับโหมดมืด -->
                <button id="btnDarkMode" class="ml-4 text-gray-400 hover:text-purple-500" title="สลับโหมดมืด"><i class="fas fa-moon"></i></button>
            </div>
            <div class="flex space-x-4 text-sm md:text-base items-center">
                <button onclick="switchTab('Generator')" class="font-medium hover:text-purple-600">สร้าง QR</button>
                <button onclick="switchTab('Dashboard')" class="font-medium hover:text-purple-600"><i class="fas fa-lock text-xs mr-1"></i>สถิติ</button>

        </nav>

        <div id="tabGenerator" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8">

                    <option value="vcard">📇 นามบัตร (vCard)</option>
                    <option value="promptpay">💸 พร้อมเพย์ (PromptPay)</option>
                    <option value="geo">📍 พิกัดแผนที่ (Location)</option>
                    <option value="event">📅 ปฏิทินนัดหมาย (Event)</option>
                    <option value="wifi">📶 WiFi</option>
                    <option value="line">💚 Line ID</option>
                    <option value="phone">📞 โทรศัพท์</option>
                </select>

                <div id="formContainer" class="mb-4">
                    <div id="urlForm" class="form-section active relative">

                    </div>
                    <div id="textForm" class="form-section relative">
                        <textarea id="textInput" placeholder="ใส่ข้อความ (กดปุ่มไมค์เพื่อพูดได้)" class="w-full p-3 rounded-lg input-field pr-10" rows="3"></textarea>

                    </div>
                    
                    <div id="vcardForm" class="form-section space-y-3">

                            <input type="text" id="vcLname" placeholder="นามสกุล" class="w-full p-3 rounded-lg input-field">
                        </div>
                        <input type="tel" id="vcPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field">
                        <input type="email" id="vcEmail" placeholder="อีเมล" class="w-full p-3 rounded-lg input-field">
                        <input type="text" id="vcOrg" placeholder="ชื่อหน่วยงาน" class="w-full p-3 rounded-lg input-field">

                        </div>

                    <div id="wifiForm" class="form-section space-y-3">

                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">สไตล์จุด</label>
                        <select id="qrDotStyle" class="w-full p-2 rounded input-field">
                            <option value="square">สี่เหลี่ยม</option>
                            <option value="dots">กลม (Dots)</option>
                            <option value="rounded">ขอบมน (Rounded)</option>
                        </select>
                    </div>
                </div>

                    <div id="dynamicOptions" class="hidden mt-3 pl-7 space-y-3">
                        <div>

                            <select id="dynDepartment" class="w-full p-2 rounded input-field text-sm">
                                <option value="ทั่วไป">ทั่วไป (General)</option>
                                <option value="งานรับฟ้อง">งานรับฟ้อง</option>
                                <option value="งานไกล่เกลี่ย">งานไกล่เกลี่ย</option>
                                <option value="งานคลัง">งานคลัง</option>

                <button id="btnGenerate" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded mt-2 transition shadow-lg"><i class="fas fa-magic mr-2"></i> สร้าง QR Code</button>

            <div class="glass flex flex-col items-center justify-center">

                </div>
                <div id="qrActions" class="mt-4 hidden flex w-full space-x-2">

                    <!-- ปุ่มโหลด SVG (ภาพ Vector) -->
                    <button id="btnDownloadSvg" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded font-bold transition text-sm"><i class="fas fa-vector-square mr-1"></i> โหลด SVG</button>
                    <button id="btnPrint" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded font-bold transition text-sm"><i class="fas fa-print mr-1"></i> พิมพ์</button>
                </div>
            </div>
        </div>

        <div id="tabDashboard" class="tab-content hidden glass">
            <h2 class="text-2xl font-bold mb-6"><i class="fas fa-chart-pie mr-2"></i> แดชบอร์ดสรุปสถิติ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div id="tabBulk" class="tab-content hidden glass">

            <button id="btnLoadBulk" class="bg-blue-600 text-white px-4 py-2 rounded font-bold mb-4 hover:bg-blue-700"><i class="fas fa-cloud-download-alt mr-2"></i> ดึงข้อมูลจาก Google Sheets</button>
            <div id="bulkResults" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
        </div>
    </div>

    <!-- Login Popup -->
    <div id="pageLogin" class="page-section fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-md text-center relative">
            <button onclick="closeLogin()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            <i class="fas fa-user-shield text-5xl text-purple-600 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">เจ้าหน้าที่ระบบ</h1>
            <p class="opacity-70 mb-6 text-sm">กรุณาเข้าสู่ระบบเพื่อใช้งานฟีเจอร์นี้</p>
            <input type="text" id="loginUsername" placeholder="ชื่อผู้ใช้งาน" class="w-full p-3 border rounded mb-4 input-field">
            <input type="password" id="loginPassword" placeholder="รหัสผ่าน" class="w-full p-3 border rounded mb-6 input-field">
            <button id="btnLogin" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded transition">เข้าสู่ระบบ</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx0eE9MmRHQCoWoUfxbHmd1BRP-XoGGTY6TsrdBX0Yadgtogd6TgD5V4BfbGVh3TmxD/exec"; 

        let currentUser = null;
        let qrCodeObj = null;
        let intendedTab = null;
        let uploadedLogo = null;

        // --- ระบบ API ---
        async function apiCall(action, payload = null) {
            try {
                if (payload) {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, ...payload })
                    });
                    return await response.json();
                } else {
                    const response = await fetch(`${API_URL}?action=${action}`);
                    return await response.json();
                }
            } catch (error) {
                return { success: false, message: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้" };
            }
        }

        // --- Dark Mode Toggle ---
        document.getElementById('btnDarkMode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = document.body.classList.contains('dark-mode') ? 'fa-sun' : 'fa-moon';
            document.getElementById('btnDarkMode').innerHTML = `<i class="fas ${icon}"></i>`;
        });

        // --- ระบบ Speech-to-Text (พิมพ์ด้วยเสียง) ---
        function startDictation(targetInputId) {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "th-TH"; // รองรับภาษาไทย

                const targetElement = document.getElementById(targetInputId);
                const micIcon = targetElement.nextElementSibling;
                micIcon.classList.add('mic-active');

                recognition.start();

                recognition.onresult = function(e) {
                    targetElement.value = e.results[0][0].transcript;
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                };

                recognition.onerror = function(e) {
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                    Swal.fire({icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถรับเสียงได้ กรุณาอนุญาตการใช้ไมโครโฟน', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                }
            } else {
                Swal.fire({icon: 'info', title: 'ไม่รองรับฟีเจอร์นี้', text: 'เบราว์เซอร์ของคุณไม่รองรับการพิมพ์ด้วยเสียง (แนะนำให้ใช้ Chrome หรือ Edge)'});
            }
        }

        // --- ระบบ UI & การนำทาง ---
        function switchTab(tabName) {
            if ((tabName === 'Dashboard' || tabName === 'Bulk') && !currentUser) {
                intendedTab = tabName;
                document.getElementById('pageLogin').classList.add('active');
                return;
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab' + tabName).classList.remove('hidden');
            if(tabName === 'Dashboard') loadDashboard();
        }

        // การจัดการหน้าฟอร์ม
        document.getElementById('qrType').addEventListener('change', function(e) {
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
