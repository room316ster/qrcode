<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Code Pro (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        /* ตัวแปรสีพื้นฐาน (รองรับ Dark Mode) */
        :root {
            --bg-body: url('https://lh3.googleusercontent.com/d/1Xz0dyDpDXotdZRF6QgvYzWuq2NUHadfR');
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1f2937;
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-border: #d1d5db;
        }

        /* โหมดมืด (Dark Mode) */
        body.dark-mode {
            --glass-bg: rgba(31, 41, 55, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --input-bg: rgba(17, 24, 39, 0.7);
            --input-border: #4b5563;
        }

        body { 
            background-image: var(--bg-body);
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: sans-serif; 
            transition: color 0.3s;
        }

        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
            padding: 2rem; 
            transition: background 0.3s, border 0.3s;
        }

        nav { 
            background: var(--glass-bg) !important; 
            backdrop-filter: blur(8px); 
            border: 1px solid var(--glass-border); 
            transition: background 0.3s; 
        }
        
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        #pageLogin.active { display: flex; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s; }
        
        .input-field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); }
        .input-field:focus { border-color: #8b5cf6; outline: none; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* ปุ่มไมค์พิมพ์ด้วยเสียง */
        .mic-btn { position: absolute; right: 10px; top: 12px; color: #8b5cf6; cursor: pointer; transition: 0.2s; }
        .mic-btn:hover { color: #6d28d9; transform: scale(1.1); }
        .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- หน้า Application หลัก -->
    <div id="pageApp" class="page-section active flex-grow p-4 md:p-8">
        <nav class="flex justify-between items-center mb-8 p-4 rounded-xl shadow">
            <div class="font-bold text-xl flex items-center">
                <i class="fas fa-qrcode text-purple-600 mr-2"></i>QR Pro
                <!-- ปุ่มสลับโหมดมืด -->
                <button id="btnDarkMode" class="ml-4 text-gray-400 hover:text-purple-500 transition" title="สลับโหมดมืด"><i class="fas fa-moon"></i></button>
            </div>
            <div class="flex space-x-4 text-sm md:text-base items-center">
                <button onclick="switchTab('Generator')" class="font-medium hover:text-purple-600 transition">สร้าง QR</button>
                <button onclick="switchTab('Dashboard')" class="font-medium hover:text-purple-600 transition"><i class="fas fa-lock text-xs mr-1"></i>สถิติ</button>
                <button onclick="switchTab('Bulk')" class="font-medium hover:text-purple-600 transition"><i class="fas fa-lock text-xs mr-1"></i>กลุ่ม</button>
                
                <button id="btnNavLogin" class="font-medium text-white bg-purple-600 px-3 py-1 rounded hover:bg-purple-700 transition shadow">เข้าสู่ระบบ</button>
                <button id="btnNavLogout" class="font-medium text-red-500 hover:text-red-700 hidden transition"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
            </div>
        </nav>

        <!-- โหมดสร้าง QR Code -->
        <div id="tabGenerator" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass">
                <h2 class="text-xl font-bold mb-4"><i class="fas fa-edit mr-2"></i>ข้อมูล & ตั้งค่า</h2>
                
                <select id="qrType" class="w-full p-3 rounded-lg input-field mb-4 font-bold">
                    <option value="url" selected>🌐 URL / Website</option>
                    <option value="text">📝 ข้อความ (Text)</option>
                    <option value="vcard">📇 นามบัตร (vCard)</option>
                    <option value="promptpay">💸 พร้อมเพย์ (PromptPay)</option>
                    <option value="geo">📍 พิกัดแผนที่ (Location)</option>
                    <option value="event">📅 ปฏิทินนัดหมาย (Event)</option>
                    <option value="wifi">📶 WiFi</option>
                    <option value="line">💚 Line ID</option>
                    <option value="phone">📞 โทรศัพท์</option>
                </select>

                <!-- Forms -->
                <div id="formContainer" class="mb-4">
                    <div id="urlForm" class="form-section active relative">
                        <input type="url" id="urlInput" placeholder="https://..." class="w-full p-3 rounded-lg input-field pr-10">
                        <i class="fas fa-microphone mic-btn" onclick="startDictation('urlInput')"></i>
                    </div>
                    <div id="textForm" class="form-section relative">
                        <textarea id="textInput" placeholder="ใส่ข้อความ (กดปุ่มไมค์เพื่อพูดได้)" class="w-full p-3 rounded-lg input-field pr-10" rows="3"></textarea>
                        <i class="fas fa-microphone mic-btn" onclick="startDictation('textInput')"></i>
                    </div>
                    
                    <div id="vcardForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="vcFname" placeholder="ชื่อ" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="vcLname" placeholder="นามสกุล" class="w-full p-3 rounded-lg input-field">
                        </div>
                        <input type="tel" id="vcPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field">
                        <input type="email" id="vcEmail" placeholder="อีเมล" class="w-full p-3 rounded-lg input-field">
                        <input type="text" id="vcOrg" placeholder="ชื่อหน่วยงาน" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="promptpayForm" class="form-section space-y-3">
                        <input type="text" id="ppId" placeholder="เบอร์มือถือ หรือ เลขบัตรประชาชน 13 หลัก" class="w-full p-3 rounded-lg input-field">
                        <input type="number" id="ppAmount" placeholder="จำนวนเงิน (ไม่ระบุก็ได้)" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="geoForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="geoLat" placeholder="ละติจูด (เช่น 15.228)" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="geoLng" placeholder="ลองจิจูด (เช่น 104.859)" class="w-full p-3 rounded-lg input-field">
                        </div>
                    </div>

                    <div id="eventForm" class="form-section space-y-3">
                        <input type="text" id="evTitle" placeholder="หัวข้อ" class="w-full p-3 rounded-lg input-field">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="datetime-local" id="evStart" class="w-full p-2 rounded-lg input-field text-sm">
                            <input type="datetime-local" id="evEnd" class="w-full p-2 rounded-lg input-field text-sm">
                        </div>
                        <input type="text" id="evLocation" placeholder="สถานที่" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="wifiForm" class="form-section space-y-3">
                        <input type="text" id="wifiSSID" placeholder="ชื่อ WiFi (SSID)" class="w-full p-3 rounded-lg input-field">
                        <input type="password" id="wifiPassword" placeholder="รหัสผ่าน" class="w-full p-3 rounded-lg input-field">
                        <select id="wifiSecurity" class="w-full p-3 rounded-lg input-field"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option></select>
                    </div>
                    <div id="lineForm" class="form-section"><input type="text" id="lineInput" placeholder="Line ID" class="w-full p-3 rounded-lg input-field"></div>
                    <div id="phoneForm" class="form-section"><input type="tel" id="phoneInput" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field"></div>
                </div>
                
                <div class="mb-4">
                    <label class="block mb-2 text-sm font-bold"><i class="fas fa-image mr-2"></i>แทรกโลโก้</label>
                    <div class="flex items-center space-x-2">
                        <input type="file" id="logoUpload" accept="image/png, image/jpeg" class="w-full input-field p-1 rounded text-sm cursor-pointer">
                        <button id="clearLogoBtn" class="bg-red-500 p-2 rounded text-white hidden transition"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">สีหลัก</label>
                        <input type="color" id="qrColor" value="#000000" class="w-full h-10 border-0 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">สไตล์จุด</label>
                        <select id="qrDotStyle" class="w-full p-2 rounded input-field">
                            <option value="square">สี่เหลี่ยม</option>
                            <option value="dots">กลม (Dots)</option>
                            <option value="rounded">ขอบมน (Rounded)</option>
                        </select>
                    </div>
                </div>
                
                <!-- Dynamic QR Options -->
                <div class="mb-4 bg-purple-50 dark:bg-gray-800 p-3 rounded border border-purple-200 dark:border-gray-600 transition" id="dynamicWrapper">
                    <label class="flex items-center text-sm font-bold text-purple-700 dark:text-purple-400 cursor-pointer">
                        <input type="checkbox" id="isDynamic" class="mr-2 h-5 w-5">
                        <i class="fas fa-link mr-2"></i> สร้าง Dynamic QR
                    </label>
                    
                    <div id="dynamicOptions" class="hidden mt-3 pl-7 space-y-3">
                        <div>
                            <label class="block text-xs font-bold mb-1">อ้างอิงกลุ่มงาน</label>
                            <select id="dynDepartment" class="w-full p-2 rounded input-field text-sm">
                                <option value="ทั่วไป">ทั่วไป (General)</option>
                                <option value="งานรับฟ้อง">งานรับฟ้อง</option>
                                <option value="งานไกล่เกลี่ย">งานไกล่เกลี่ย</option>
                                <option value="งานคลัง">งานคลัง</option>
                                <option value="หน้าบัลลังก์">หน้าบัลลังก์</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">วันหมดอายุ (เว้นว่างได้หากไม่จำกัด)</label>
                            <input type="date" id="dynExpiry" class="w-full p-2 rounded input-field text-sm">
                        </div>
                    </div>
                </div>

                <button id="btnGenerate" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded mt-2 transition shadow-lg"><i class="fas fa-magic mr-2"></i> สร้าง QR Code</button>
            </div>

            <!-- Preview Area -->
            <div class="glass flex flex-col items-center justify-center">
                <h2 class="text-xl font-bold mb-4 w-full text-left">ผลลัพธ์</h2>
                <div id="qrCanvas" class="input-field p-4 rounded-xl shadow-inner min-h-[300px] flex items-center justify-center w-full">
                    <p class="opacity-50"><i class="fas fa-qrcode text-4xl mb-2 block text-center"></i>รอการสร้าง...</p>
                </div>
                <div id="qrActions" class="mt-4 hidden flex w-full space-x-2">
                    <button id="btnDownload" class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded font-bold transition text-sm shadow"><i class="fas fa-image mr-1"></i> โหลด PNG</button>
                    <button id="btnDownloadSvg" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded font-bold transition text-sm shadow"><i class="fas fa-vector-square mr-1"></i> โหลด SVG</button>
                    <button id="btnPrint" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded font-bold transition text-sm shadow"><i class="fas fa-print mr-1"></i> พิมพ์</button>
                </div>
            </div>
        </div>

        <!-- โหมด Dashboard -->
        <div id="tabDashboard" class="tab-content hidden glass">
            <h2 class="text-2xl font-bold mb-6"><i class="fas fa-chart-pie mr-2"></i> แดชบอร์ดสรุปสถิติ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-blue-50 dark:bg-gray-800 p-6 rounded-xl border border-blue-200 dark:border-gray-600 transition">
                    <h3 class="font-bold text-lg text-blue-600">Dynamic QR ทั้งหมด</h3>
                    <p id="statDynamic" class="text-4xl font-black mt-2">...</p>
                </div>
                <div class="bg-green-50 dark:bg-gray-800 p-6 rounded-xl border border-green-200 dark:border-gray-600 transition">
                    <h3 class="font-bold text-lg text-green-600">ประวัติการใช้งาน (Logs)</h3>
                    <p id="statLogs" class="text-4xl font-black mt-2">...</p>
                </div>
            </div>
            <button onclick="loadDashboard()" class="mt-6 bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition shadow"><i class="fas fa-sync-alt mr-2"></i> รีเฟรชข้อมูล</button>
        </div>

        <!-- โหมด Bulk -->
        <div id="tabBulk" class="tab-content hidden glass">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-layer-group mr-2"></i> สร้าง QR Code แบบกลุ่ม</h2>
            <button id="btnLoadBulk" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold mb-4 transition shadow"><i class="fas fa-cloud-download-alt mr-2"></i> ดึงข้อมูลจาก Google Sheets</button>
            <div id="bulkResults" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
        </div>
    </div>

    <!-- Login Popup -->
    <div id="pageLogin" class="page-section fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-md text-center relative animate-bounce-short">
            <button onclick="closeLogin()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            <i class="fas fa-user-shield text-5xl text-purple-600 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">เจ้าหน้าที่ระบบ</h1>
            <p class="opacity-70 mb-6 text-sm">กรุณาเข้าสู่ระบบเพื่อใช้งานฟีเจอร์นี้</p>
            <input type="text" id="loginUsername" placeholder="ชื่อผู้ใช้งาน" class="w-full p-3 border rounded mb-4 input-field">
            <input type="password" id="loginPassword" placeholder="รหัสผ่าน" class="w-full p-3 border rounded mb-6 input-field">
            <button id="btnLogin" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded transition shadow-lg">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- Script ควบคุมการทำงานทั้งหมด -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx0eE9MmRHQCoWoUfxbHmd1BRP-XoGGTY6TsrdBX0Yadgtogd6TgD5V4BfbGVh3TmxD/exec"; 

        let currentUser = null;
        let qrCodeObj = null;
        let intendedTab = null;
        let uploadedLogo = null;

        // --- 1. ระบบ API ---
        async function apiCall(action, payload = null) {
            try {
                if (payload) {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, ...payload })
                    });
                    return await response.json();
                } else {
                    const response = await fetch(`${API_URL}?action=${action}`);
                    return await response.json();
                }
            } catch (error) {
                return { success: false, message: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้" };
            }
        }

        // --- 2. ฟังก์ชัน UI (Dark Mode & Speech-to-Text) ---
        document.getElementById('btnDarkMode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = document.body.classList.contains('dark-mode') ? 'fa-sun' : 'fa-moon';
            document.getElementById('btnDarkMode').innerHTML = `<i class="fas ${icon}"></i>`;
        });

        function startDictation(targetInputId) {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "th-TH";

                const targetElement = document.getElementById(targetInputId);
                const micIcon = targetElement.nextElementSibling;
                micIcon.classList.add('mic-active');

                recognition.start();

                recognition.onresult = function(e) {
                    targetElement.value = e.results[0][0].transcript;
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                };

                recognition.onerror = function(e) {
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                    Swal.fire({icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถรับเสียงได้ กรุณาตรวจสอบไมโครโฟน', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                }
            } else {
                Swal.fire({icon: 'info', title: 'ไม่รองรับ', text: 'เบราว์เซอร์ของคุณไม่รองรับการพิมพ์ด้วยเสียง (แนะนำ Google Chrome)'});
            }
        }

        // --- 3. ระบบนำทาง (Navigation & Tabs) ---
        function switchTab(tabName) {
            if ((tabName === 'Dashboard' || tabName === 'Bulk') && !currentUser) {
                intendedTab = tabName;
                document.getElementById('pageLogin').classList.add('active');
                return;
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab' + tabName).classList.remove('hidden');
            if(tabName === 'Dashboard') loadDashboard();
        }

        document.getElementById('qrType').addEventListener('change', function(e) {
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            const formId = e.target.value + 'Form';
            if(document.getElementById(formId)) document.getElementById(formId).classList.add('active');
            
            if(e.target.value === 'url') {
                document.getElementById('dynamicWrapper').style.display = 'block';
            } else {
                document.getElementById('dynamicWrapper').style.display = 'none';
                document.getElementById('isDynamic').checked = false;
                document.getElementById('dynamicOptions').classList.add('hidden');
            }
        });

        document.getElementById('isDynamic').addEventListener('change', function(e) {
            if (e.target.checked) {
                document.getElementById('dynamicOptions').classList.remove('hidden');
            } else {
                document.getElementById('dynamicOptions').classList.add('hidden');
            }
        });

        document.getElementById('logoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedLogo = event.target.result;
                document.getElementById('clearLogoBtn').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });
        
        document.getElementById('clearLogoBtn').addEventListener('click', () => {
            uploadedLogo = null;
            document.getElementById('logoUpload').value = '';
            document.getElementById('clearLogoBtn').classList.add('hidden');
        });

        // --- 4. ระบบยืนยันตัวตน (Login/Logout) ---
        document.getElementById('btnNavLogin').addEventListener('click', () => {
            document.getElementById('pageLogin').classList.add('active');
        });
        
        function closeLogin() {
            document.getElementById('pageLogin').classList.remove('active');
            intendedTab = null;
        }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;
            if(!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
            
            Swal.showLoading();
            const res = await apiCall('login', { username: user, password: pass });
            
            if(res.success) {
                currentUser = user;
                document.getElementById('pageLogin').classList.remove('active');
                document.getElementById('btnNavLogin').classList.add('hidden');
                document.getElementById('btnNavLogout').classList.remove('hidden');
                
                Swal.fire({icon: 'success', title: 'ยินดีต้อนรับ', text: res.name, timer: 1500, showConfirmButton: false});
                
                if(intendedTab) {
                    switchTab(intendedTab);
                    intendedTab = null;
                }
            } else {
                Swal.fire('ข้อผิดพลาด', res.message, 'error');
            }
        });

        document.getElementById('btnNavLogout').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('btnNavLogin').classList.remove('hidden');
            document.getElementById('btnNavLogout').classList.add('hidden');
            switchTab('Generator'); 
            Swal.fire({icon: 'info', title: 'ออกจากระบบแล้ว', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500});
        });

        // --- 5. การสร้าง QR Code หลัก ---
        document.getElementById('btnGenerate').addEventListener('click', async () => {
            const type = document.getElementById('qrType').value;
            const isDynamic = document.getElementById('isDynamic').checked;
            
            if (isDynamic && !currentUser) {
                intendedTab = null;
                document.getElementById('pageLogin').classList.add('active');
                Swal.fire({icon: 'info', title: 'สำหรับเจ้าหน้าที่', text: 'กรุณาเข้าสู่ระบบก่อนสร้าง Dynamic QR'});
                return;
            }

            const dataStr = collectAndFormatData(type);
            if(!dataStr) return; 

            if (isDynamic) {
                Swal.showLoading();
                const expiry = document.getElementById('dynExpiry').value;
                const dept = document.getElementById('dynDepartment').value;
                
                const res = await apiCall('saveDynamic', { 
                    url: dataStr, 
                    user: currentUser,
                    expiry: expiry,
                    department: dept
                });
                
                if (res.success) {
                    renderQR(res.url); 
                    Swal.close();
                } else {
                    Swal.fire('Error', res.message, 'error');
                }
            } else {
                renderQR(dataStr);
            }
        });

        function renderQR(dataStr) {
            const container = document.getElementById('qrCanvas');
            container.innerHTML = '';
            
            const options = {
                width: 300, height: 300, data: dataStr, margin: 5,
                dotsOptions: { color: document.getElementById('qrColor').value, type: document.getElementById('qrDotStyle').value },
                cornersSquareOptions: { type: "extra-rounded" },
                imageOptions: { crossOrigin: "anonymous", margin: 10 }
            };

            if(uploadedLogo) {
                options.image = uploadedLogo;
                options.dotsOptions.type = 'rounded'; 
            }

            qrCodeObj = new QRCodeStyling(options);
            qrCodeObj.append(container);
            document.getElementById('qrActions').classList.remove('hidden');
        }

        // จัดฟอร์แมตข้อมูลตามประเภท
        function collectAndFormatData(type) {
            try {
                switch (type) {
                    case 'url': 
                        let url = document.getElementById('urlInput').value;
                        if(!url) throw "กรุณากรอก URL";
                        return /^https?:\/\//i.test(url) ? url : 'https://' + url;
                    case 'text': 
                        let txt = document.getElementById('textInput').value;
                        if(!txt) throw "กรุณากรอกข้อความ";
                        return txt;
                    case 'vcard': 
                        let fn = document.getElementById('vcFname').value;
                        let ph = document.getElementById('vcPhone').value;
                        if(!fn || !ph) throw "กรุณากรอกชื่อและเบอร์โทร";
                        return `BEGIN:VCARD\nVERSION:3.0\nN:${document.getElementById('vcLname').value};${fn}\nFN:${fn} ${document.getElementById('vcLname').value}\nORG:${document.getElementById('vcOrg').value}\nTEL:${ph}\nEMAIL:${document.getElementById('vcEmail').value}\nEND:VCARD`;
                    case 'promptpay': 
                        let pp = document.getElementById('ppId').value;
                        if(!pp) throw "กรุณากรอกหมายเลขพร้อมเพย์";
                        return generatePromptPayPayload(pp, document.getElementById('ppAmount').value);
                    case 'geo': 
                        let lat = document.getElementById('geoLat').value;
                        if(!lat) throw "กรุณากรอกละติจูด";
                        return `geo:${lat},${document.getElementById('geoLng').value}`;
                    case 'event': 
                        let title = document.getElementById('evTitle').value;
                        if(!title) throw "กรุณากรอกหัวข้อ";
                        const formatDT = (dt) => dt.replace(/[-:]/g, '') + '00Z';
                        return `BEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${formatDT(document.getElementById('evStart').value)}\nDTEND:${formatDT(document.getElementById('evEnd').value)}\nLOCATION:${document.getElementById('evLocation').value}\nEND:VEVENT`;
                    case 'wifi': 
                        let ssid = document.getElementById('wifiSSID').value;
                        if(!ssid) throw "กรุณากรอกชื่อ WiFi";
                        return `WIFI:T:${document.getElementById('wifiSecurity').value};S:${ssid};P:${document.getElementById('wifiPassword').value};;`;
                    case 'line': 
                        let line = document.getElementById('lineInput').value;
                        if(!line) throw "กรุณากรอก Line ID";
                        return `https://line.me/ti/p/${line}`;
                    case 'phone': 
                        let phone = document.getElementById('phoneInput').value;
                        if(!phone) throw "กรุณากรอกเบอร์โทร";
                        return `tel:${phone}`;
                    default: return '';
                }
            } catch (err) {
                Swal.fire({icon: 'warning', title: 'ข้อมูลไม่ครบ', text: err});
                return null;
            }
        }

        // คำนวณ Payload ของพร้อมเพย์
        function generatePromptPayPayload(id, amount) {
            let idClean = id.replace(/[^0-9]/g, '');
            let payload = "00020101021129370016A000000677010111";
            if (idClean.length === 10) payload += "01130066" + idClean.substring(1);
            else if (idClean.length === 13) payload += "0213" + idClean;
            else throw "หมายเลขพร้อมเพย์ต้องเป็นเบอร์มือถือ(10หลัก) หรือบัตรประชาชน(13หลัก)";
            payload += "5802TH5303764";
            if (amount && amount > 0) {
                let amtStr = parseFloat(amount).toFixed(2).toString();
                payload += "54" + amtStr.length.toString().padStart(2, '0') + amtStr;
            }
            payload += "6304";
            
            let crc = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                crc ^= payload.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        // --- 6. ปุ่มดาวน์โหลดและพิมพ์ ---
        document.getElementById('btnDownload').addEventListener('click', () => { if(qrCodeObj) qrCodeObj.download({ extension: "png" }); });
        document.getElementById('btnDownloadSvg').addEventListener('click', () => { if(qrCodeObj) qrCodeObj.download({ extension: "svg" }); });
        document.getElementById('btnPrint').addEventListener('click', () => { window.print(); });

        // --- 7. สถิติและระบบสร้างแบบกลุ่ม (Bulk) ---
        async function loadDashboard() {
            const stats = await apiCall('getStats');
            document.getElementById('statDynamic').textContent = stats.totalDynamic || 0;
            document.getElementById('statLogs').textContent = stats.totalLogs || 0;
        }

        document.getElementById('btnLoadBulk').addEventListener('click', async () => {
            Swal.showLoading();
            const data = await apiCall('getBulk');
            const container = document.getElementById('bulkResults');
            container.innerHTML = '';
            
            if(data && data.length > 0) {
                data.forEach((row, index) => {
                    if(!row[0]) return;
                    const div = document.createElement('div');
                    div.className = "border p-4 rounded bg-white text-center shadow-sm dark:bg-gray-800 dark:border-gray-600";
                    container.appendChild(div);

                    const bulkQr = new QRCodeStyling({ width: 120, height: 120, data: row[0], margin: 5 });
                    bulkQr.append(div);
                    
                    const label = document.createElement('p');
                    label.className = "text-xs mt-2 font-bold truncate text-gray-800 dark:text-gray-200";
                    label.textContent = row[2] || 'QR_' + (index+1);
                    div.appendChild(label);
                });
            } else {
                container.innerHTML = '<p class="col-span-4 text-center text-gray-500">ไม่พบข้อมูลใน Google Sheets</p>';
            }
            Swal.close();
        });
    </script>
</body>
