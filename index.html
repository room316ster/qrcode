<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Code Pro (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        /* ตัวแปรสีพื้นฐาน (รองรับ Dark Mode) */
        :root {
            --bg-body: url('https://lh3.googleusercontent.com/d/1Xz0dyDpDXotdZRF6QgvYzWuq2NUHadfR');
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1f2937;
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-border: #d1d5db;
        }

        /* โหมดมืด (Dark Mode) */
        body.dark-mode {
            --glass-bg: rgba(31, 41, 55, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --input-bg: rgba(17, 24, 39, 0.7);
            --input-border: #4b5563;
        }

        body { 
            background-image: var(--bg-body);
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: sans-serif; 
            transition: color 0.3s;
        }

        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
            padding: 2rem; 
            transition: background 0.3s, border 0.3s;
        }

        nav { 
            background: var(--glass-bg) !important; 
            backdrop-filter: blur(8px); 
            border: 1px solid var(--glass-border); 
            transition: background 0.3s; 
        }
        
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        
        /* แก้ไขปัญหาหน้าต่าง Login ลอยไปมุมซ้ายบน */
        #pageLogin.active { display: flex !important; } 
        
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s; }
        
        .input-field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); }
        .input-field:focus { border-color: #8b5cf6; outline: none; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* ปุ่มไมค์พิมพ์ด้วยเสียง */
        .mic-btn { position: absolute; right: 10px; top: 12px; color: #8b5cf6; cursor: pointer; transition: 0.2s; }
        .mic-btn:hover { color: #6d28d9; transform: scale(1.1); }
        .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- หน้า Application หลัก -->
    <div id="pageApp" class="page-section active flex-grow p-4 md:p-8">
        <nav class="flex justify-between items-center mb-8 p-4 rounded-xl shadow">
            <div class="font-bold text-xl flex items-center">
                <i class="fas fa-qrcode text-purple-600 mr-2"></i>QR Pro
                <!-- ปุ่มสลับโหมดมืด -->
                <button id="btnDarkMode" class="ml-4 text-gray-400 hover:text-purple-500 transition" title="สลับโหมดมืด"><i class="fas fa-moon"></i></button>
            </div>
            <div class="flex space-x-4 text-sm md:text-base items-center">
                <button onclick="switchTab('Generator')" class="font-medium hover:text-purple-600 transition">สร้าง QR</button>
                <button onclick="switchTab('Dashboard')" class="font-medium hover:text-purple-600 transition"><i class="fas fa-lock text-xs mr-1"></i>สถิติ</button>
                <button onclick="switchTab('Bulk')" class="font-medium hover:text-purple-600 transition"><i class="fas fa-lock text-xs mr-1"></i>กลุ่ม</button>
                
                <button id="btnNavLogin" class="font-medium text-white bg-purple-600 px-3 py-1 rounded hover:bg-purple-700 transition shadow">เข้าสู่ระบบ</button>
                <button id="btnNavLogout" class="font-medium text-red-500 hover:text-red-700 hidden transition"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
            </div>
        </nav>

        <!-- โหมดสร้าง QR Code -->
        <div id="tabGenerator" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass">
                <h2 class="text-xl font-bold mb-4"><i class="fas fa-edit mr-2"></i>ข้อมูล & ตั้งค่า</h2>
                
                <select id="qrType" class="w-full p-3 rounded-lg input-field mb-4 font-bold">
                    <option value="url" selected>🌐 URL / Website</option>
                    <option value="text">📝 ข้อความ (Text)</option>
                    <option value="vcard">📇 นามบัตร (vCard)</option>
                    <option value="promptpay">💸 พร้อมเพย์ (PromptPay)</option>
                    <option value="geo">📍 พิกัดแผนที่ (Location)</option>
                    <option value="event">📅 ปฏิทินนัดหมาย (Event)</option>
                    <option value="wifi">📶 WiFi</option>
                    <option value="line">💚 Line ID</option>
                    <option value="phone">📞 โทรศัพท์</option>
                </select>

                <!-- Forms -->
                <div id="formContainer" class="mb-4">
                    <div id="urlForm" class="form-section active relative">
                        <input type="url" id="urlInput" placeholder="https://..." class="w-full p-3 rounded-lg input-field pr-10">
                        <i class="fas fa-microphone mic-btn" onclick="startDictation('urlInput')"></i>
                    </div>
                    <div id="textForm" class="form-section relative">
                        <textarea id="textInput" placeholder="ใส่ข้อความ (กดปุ่มไมค์เพื่อพูดได้)" class="w-full p-3 rounded-lg input-field pr-10" rows="3"></textarea>
                        <i class="fas fa-microphone mic-btn" onclick="startDictation('textInput')"></i>
                    </div>
                    
                    <div id="vcardForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="vcFname" placeholder="ชื่อ" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="vcLname" placeholder="นามสกุล" class="w-full p-3 rounded-lg input-field">
                        </div>
                        <input type="tel" id="vcPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field">
                        <input type="email" id="vcEmail" placeholder="อีเมล" class="w-full p-3 rounded-lg input-field">
                        <input type="text" id="vcOrg" placeholder="ชื่อหน่วยงาน" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="promptpayForm" class="form-section space-y-3">
                        <input type="text" id="ppId" placeholder="เบอร์มือถือ หรือ เลขบัตรประชาชน 13 หลัก" class="w-full p-3 rounded-lg input-field">
                        <input type="number" id="ppAmount" placeholder="จำนวนเงิน (ไม่ระบุก็ได้)" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="geoForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="geoLat" placeholder="ละติจูด (เช่น 15.228)" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="geoLng" placeholder="ลองจิจูด (เช่น 104.859)" class="w-full p-3 rounded-lg input-field">
                        </div>
                    </div>

                    <div id="eventForm" class="form-section space-y-3">
                        <input type="text" id="evTitle" placeholder="หัวข้อ" class="w-full p-3 rounded-lg input-field">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="datetime-local" id="evStart" class="w-full p-2 rounded-lg input-field text-sm">
                            <input type="datetime-local" id="evEnd" class="w-full p-2 rounded-lg input-field text-sm">
                        </div>
                        <input type="text" id="evLocation" placeholder="สถานที่" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="wifiForm" class="form-section space-y-3">
                        <input type="text" id="wifiSSID" placeholder="ชื่อ WiFi (SSID)" class="w-full p-3 rounded-lg input-field">
                        <input type="password" id="wifiPassword" placeholder="รหัสผ่าน" class="w-full p-3 rounded-lg input-field">
                        <select id="wifiSecurity" class="w-full p-3 rounded-lg input-field"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option></select>
                    </div>
                    <div id="lineForm" class="form-section"><input type="text" id="lineInput" placeholder="Line ID" class="w-full p-3 rounded-lg input-field"></div>
                    <div id="phoneForm" class="form-section"><input type="tel" id="phoneInput" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field"></div>
                </div>
                
                <div class="mb-4">
                    <label class="block mb-2 text-sm font-bold"><i class="fas fa-image mr-2"></i>แทรกโลโก้</label>
                    <div class="flex items-center space-x-2">
                        <input type="file" id="logoUploadขออภัยอย่างยิ่งครับที่โค้ดในข้อความก่อนหน้านี้ขาดหายไปในช่วงท้าย ทำให้คุณคัดลอกไปใช้งานได้ไม่ครบถ้วน 

นี่คือโค้ดไฟล์ **`index.html`** ฉบับสมบูรณ์ตั้งแต่บรรทัดแรกจนถึงบรรทัดสุดท้าย (รวมการแก้ไขให้หน้าต่าง Login อยู่ตรงกลาง และภาพพื้นหลังเรียบร้อยแล้ว) คุณสามารถคัดลอกโค้ดทั้งหมดนี้ไปวางทับไฟล์เดิมได้เลยครับ:
