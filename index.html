<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Code Pro (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        /* ตัวแปรสีพื้นฐาน (รองรับ Dark Mode) */
        :root {
            /* เปลี่ยนพื้นหลังเป็น Gradient ที่เสถียรและสวยงาม แทนลิงก์ Google Drive ที่หมดอายุ */
            --bg-image: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%); 
            --bg-fallback: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1f2937;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: #d1d5db;
        }

        /* โหมดมืด (Dark Mode) */
        body.dark-mode {
            --bg-image: linear-gradient(135deg, #1e1b4b 0%, #111827 100%); 
            --bg-fallback: #111827;
            --glass-bg: rgba(31, 41, 55, 0.90);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --input-bg: rgba(17, 24, 39, 0.8);
            --input-border: #4b5563;
        }

        body { 
            background-color: var(--bg-fallback);
            background-image: var(--bg-image);
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main); 
            font-family: sans-serif; 
            transition: color 0.3s, background-color 0.3s;
        }

        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
            padding: 2rem; 
            transition: background 0.3s, border 0.3s;
        }

        nav { 
            background: var(--glass-bg) !important; 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); 
            transition: background 0.3s; 
        }
        
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        
        /* การจัดกึ่งกลางของหน้าต่าง Login */
        #pageLogin.active { display: flex !important; align-items: center; justify-content: center; } 
        
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s; }
        
        .input-field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); }
        .input-field:focus { border-color: #8b5cf6; outline: none; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); background: #ffffff; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* ปุ่มไมค์พิมพ์ด้วยเสียง */
        .mic-btn { position: absolute; right: 12px; top: 12px; color: #8b5cf6; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .mic-btn:hover { color: #6d28d9; transform: scale(1.15); }
        .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- หน้า Application หลัก -->
    <div id="pageApp" class="page-section active flex-grow p-4 md:p-8">
        <nav class="flex justify-between items-center mb-8 p-4 rounded-xl shadow-md">
            <div class="font-bold text-xl flex items-center">
                <i class="fas fa-qrcode text-purple-600 mr-2 text-2xl"></i>QR Pro
                <!-- ปุ่มสลับโหมดมืด -->
                <button id="btnDarkMode" class="ml-4 text-gray-400 hover:text-purple-500 transition focus:outline-none" title="สลับโหมดมืด"><i class="fas fa-moon text-lg"></i></button>
            </div>
            <div class="flex space-x-4 text-sm md:text-base items-center">
                <button onclick="window.switchTab('Generator')" class="font-medium hover:text-purple-600 transition focus:outline-none">สร้าง QR</button>
                <button onclick="window.switchTab('Dashboard')" class="font-medium hover:text-purple-600 transition focus:outline-none"><i class="fas fa-lock text-xs mr-1 opacity-70"></i>สถิติ</button>
                <button onclick="window.switchTab('Bulk')" class="font-medium hover:text-purple-600 transition focus:outline-none"><i class="fas fa-lock text-xs mr-1 opacity-70"></i>กลุ่ม</button>
                
                <button id="btnNavLogin" class="font-medium text-white bg-purple-600 px-4 py-2 rounded-lg hover:bg-purple-700 transition shadow focus:outline-none">เข้าสู่ระบบ</button>
                <button id="btnNavLogout" class="font-medium text-red-500 hover:text-red-700 hidden transition focus:outline-none"><i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ</button>
            </div>
        </nav>

        <!-- โหมดสร้าง QR Code -->
        <div id="tabGenerator" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8 max-w-7xl mx-auto">
            
            <!-- พาเนลฝั่งซ้าย: ข้อมูลและการตั้งค่า -->
            <div class="glass">
                <h2 class="text-xl font-bold mb-5 flex items-center"><i class="fas fa-edit mr-2 text-purple-600"></i>ข้อมูล & ตั้งค่า</h2>
                
                <select id="qrType" class="w-full p-3 rounded-lg input-field mb-5 font-bold cursor-pointer">
                    <option value="url" selected>🌐 URL / Website</option>
                    <option value="text">📝 ข้อความ (Text)</option>
                    <option value="vcard">📇 นามบัตร (vCard)</option>
                    <option value="promptpay">💸 พร้อมเพย์ (PromptPay)</option>
                    <option value="geo">📍 พิกัดแผนที่ (Location)</option>
                    <option value="event">📅 ปฏิทินนัดหมาย (Event)</option>
                    <option value="wifi">📶 WiFi</option>
                    <option value="line">💚 Line ID</option>
                    <option value="phone">📞 โทรศัพท์</option>
                </select>

                <!-- 1. ส่วนกรอกข้อมูล (Forms) -->
                <div id="formContainer" class="mb-5">
                    <div id="urlForm" class="form-section active relative">
                        <input type="url" id="urlInput" placeholder="https://..." class="w-full p-3 rounded-lg input-field pr-10">
                        <i class="fas fa-microphone mic-btn" onclick="window.startDictation('urlInput')" title="พิมพ์ด้วยเสียง"></i>
                    </div>
                    <div id="textForm" class="form-section relative">
                        <textarea id="textInput" placeholder="ใส่ข้อความ (กดปุ่มไมค์เพื่อพูดได้)" class="w-full p-3 rounded-lg input-field pr-10" rows="4"></textarea>
                        <i class="fas fa-microphone mic-btn" onclick="window.startDictation('textInput')" title="พิมพ์ด้วยเสียง"></i>
                    </div>
                    
                    <div id="vcardForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="vcFname" placeholder="ชื่อ" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="vcLname" placeholder="นามสกุล" class="w-full p-3 rounded-lg input-field">
                        </div>
                        <input type="tel" id="vcPhone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field">
                        <input type="email" id="vcEmail" placeholder="อีเมล" class="w-full p-3 rounded-lg input-field">
                        <input type="text" id="vcOrg" placeholder="ชื่อหน่วยงาน" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="promptpayForm" class="form-section space-y-3">
                        <input type="text" id="ppId" placeholder="เบอร์มือถือ หรือ เลขบัตรประชาชน 13 หลัก" class="w-full p-3 rounded-lg input-field">
                        <input type="number" id="ppAmount" placeholder="จำนวนเงิน (ไม่ระบุก็ได้)" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="geoForm" class="form-section space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="geoLat" placeholder="ละติจูด (เช่น 15.228)" class="w-full p-3 rounded-lg input-field">
                            <input type="text" id="geoLng" placeholder="ลองจิจูด (เช่น 104.859)" class="w-full p-3 rounded-lg input-field">
                        </div>
                    </div>

                    <div id="eventForm" class="form-section space-y-3">
                        <input type="text" id="evTitle" placeholder="หัวข้อ" class="w-full p-3 rounded-lg input-field">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="datetime-local" id="evStart" class="w-full p-2 rounded-lg input-field text-sm">
                            <input type="datetime-local" id="evEnd" class="w-full p-2 rounded-lg input-field text-sm">
                        </div>
                        <input type="text" id="evLocation" placeholder="สถานที่" class="w-full p-3 rounded-lg input-field">
                    </div>

                    <div id="wifiForm" class="form-section space-y-3">
                        <input type="text" id="wifiSSID" placeholder="ชื่อ WiFi (SSID)" class="w-full p-3 rounded-lg input-field">
                        <input type="password" id="wifiPassword" placeholder="รหัสผ่าน" class="w-full p-3 rounded-lg input-field">
                        <select id="wifiSecurity" class="w-full p-3 rounded-lg input-field cursor-pointer"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option></select>
                    </div>
                    <div id="lineForm" class="form-section"><input type="text" id="lineInput" placeholder="Line ID" class="w-full p-3 rounded-lg input-field"></div>
                    <div id="phoneForm" class="form-section"><input type="tel" id="phoneInput" placeholder="เบอร์โทรศัพท์" class="w-full p-3 rounded-lg input-field"></div>
                </div>
                
                <hr class="my-5 border-gray-300 dark:border-gray-600">

                <!-- 2. การตั้งค่าดีไซน์ -->
                <div class="mb-5">
                    <label class="block mb-2 text-sm font-bold opacity-80"><i class="fas fa-image mr-2"></i>แทรกโลโก้</label>
                    <div class="flex items-center space-x-2">
                        <input type="file" id="logoUpload" accept="image/png, image/jpeg" class="w-full input-field p-2 rounded-lg text-sm cursor-pointer">
                        <button id="clearLogoBtn" class="bg-red-500 hover:bg-red-600 p-2.5 rounded-lg text-white hidden transition focus:outline-none"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-80">สีหลัก</label>
                        <input type="color" id="qrColor" value="#000000" class="w-full h-11 border-0 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-80">สไตล์จุด</label>
                        <select id="qrDotStyle" class="w-full p-2.5 rounded-lg input-field cursor-pointer">
                            <option value="square">สี่เหลี่ยม</option>
                            <option value="dots">กลม (Dots)</option>
                            <option value="rounded">ขอบมน (Rounded)</option>
                        </select>
                    </div>
                </div>
                
                <!-- 3. Dynamic QR Options -->
                <div class="mb-5 bg-purple-50 dark:bg-gray-800 p-4 rounded-xl border border-purple-200 dark:border-gray-600 transition" id="dynamicWrapper">
                    <label class="flex items-center text-sm font-bold text-purple-700 dark:text-purple-400 cursor-pointer">
                        <input type="checkbox" id="isDynamic" class="mr-3 h-5 w-5 rounded text-purple-600 focus:ring-purple-500 cursor-pointer">
                        <i class="fas fa-link mr-2"></i> สร้าง Dynamic QR
                    </label>
                    
                    <div id="dynamicOptions" class="hidden mt-4 pl-8 space-y-4 border-l-2 border-purple-200 dark:border-gray-600">
                        <div>
                            <label class="block text-xs font-bold mb-1 opacity-80">อ้างอิงกลุ่มงาน</label>
                            <select id="dynDepartment" class="w-full p-2 rounded-lg input-field text-sm cursor-pointer">
                                <option value="ทั่วไป">ทั่วไป (General)</option>
                                <option value="งานรับฟ้อง">งานรับฟ้อง</option>
                                <option value="งานไกล่เกลี่ย">งานไกล่เกลี่ย</option>
                                <option value="งานคลัง">งานคลัง</option>
                                <option value="หน้าบัลลังก์">หน้าบัลลังก์</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 opacity-80">วันหมดอายุ (เว้นว่างได้หากไม่จำกัด)</label>
                            <input type="date" id="dynExpiry" class="w-full p-2 rounded-lg input-field text-sm cursor-pointer">
                        </div>
                    </div>
                </div>

                <button id="btnGenerate" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg focus:outline-none"><i class="fas fa-magic mr-2"></i> สร้าง QR Code</button>
            </div>

            <!-- พาเนลฝั่งขวา: Preview Area -->
            <div class="glass flex flex-col items-center justify-start">
                <h2 class="text-xl font-bold mb-5 w-full text-left flex items-center"><i class="fas fa-eye mr-2 text-purple-600"></i>ผลลัพธ์</h2>
                <div id="qrCanvas" class="input-field p-6 rounded-2xl shadow-inner min-h-[350px] flex items-center justify-center w-full bg-white dark:bg-gray-100">
                    <p class="opacity-40 text-gray-800 dark:text-gray-800 flex flex-col items-center">
                        <i class="fas fa-qrcode text-6xl mb-3"></i>
                        <span>รอการสร้าง...</span>
                    </p>
                </div>
                <div id="qrActions" class="mt-6 hidden flex w-full space-x-3">
                    <button id="btnDownload" class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2.5 rounded-lg font-bold transition text-sm shadow focus:outline-none"><i class="fas fa-image mr-1"></i> โหลด PNG</button>
                    <button id="btnDownloadSvg" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-2.5 rounded-lg font-bold transition text-sm shadow focus:outline-none"><i class="fas fa-vector-square mr-1"></i> โหลด SVG</button>
                    <button id="btnPrint" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2.5 rounded-lg font-bold transition text-sm shadow focus:outline-none"><i class="fas fa-print mr-1"></i> พิมพ์</button>
                </div>
            </div>
        </div>

        <!-- โหมด Dashboard -->
        <div id="tabDashboard" class="tab-content hidden glass max-w-7xl mx-auto">
            <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fas fa-chart-pie mr-3 text-purple-600"></i> แดชบอร์ดสรุปสถิติ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-blue-50 dark:bg-gray-800 p-8 rounded-2xl border border-blue-200 dark:border-gray-600 transition shadow-sm">
                    <h3 class="font-bold text-lg text-blue-600 dark:text-blue-400">Dynamic QR ทั้งหมดในระบบ</h3>
                    <p id="statDynamic" class="text-5xl font-black mt-3 text-gray-800 dark:text-gray-100">...</p>
                </div>
                <div class="bg-green-50 dark:bg-gray-800 p-8 rounded-2xl border border-green-200 dark:border-gray-600 transition shadow-sm">
                    <h3 class="font-bold text-lg text-green-600 dark:text-green-400">ประวัติการใช้งานระบบ (Logs)</h3>
                    <p id="statLogs" class="text-5xl font-black mt-3 text-gray-800 dark:text-gray-100">...</p>
                </div>
            </div>
            <button onclick="window.loadDashboard()" class="mt-8 bg-gray-200 dark:bg-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition shadow focus:outline-none"><i class="fas fa-sync-alt mr-2"></i> รีเฟรชข้อมูลล่าสุด</button>
        </div>

        <!-- โหมด Bulk -->
        <div id="tabBulk" class="tab-content hidden glass max-w-7xl mx-auto">
            <h2 class="text-xl font-bold mb-5 flex items-center"><i class="fas fa-layer-group mr-3 text-purple-600"></i> สร้าง QR Code แบบกลุ่ม</h2>
            <button id="btnLoadBulk" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-bold mb-6 transition shadow focus:outline-none"><i class="fas fa-cloud-download-alt mr-2"></i> ดึงข้อมูลจากตาราง Google Sheets</button>
            <div id="bulkResults" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5 mt-4"></div>
        </div>
    </div>

    <!-- Login Popup -->
    <div id="pageLogin" class="page-section fixed inset-0 bg-black bg-opacity-70 z-50 p-4">
        <div class="glass w-full max-w-sm text-center relative shadow-2xl">
            <button onclick="window.closeLogin()" class="absolute top-4 right-5 text-gray-400 hover:text-red-500 transition focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            <div class="mb-6 mt-2">
                <i class="fas fa-user-shield text-5xl text-purple-600 mb-3 drop-shadow"></i>
                <h1 class="text-2xl font-bold mb-1">เจ้าหน้าที่ระบบ</h1>
                <p class="opacity-70 text-sm">กรุณาเข้าสู่ระบบเพื่อยืนยันสิทธิ์</p>
            </div>
            <input type="text" id="loginUsername" placeholder="ชื่อผู้ใช้งาน" class="w-full p-3.5 border rounded-lg mb-4 input-field">
            <input type="password" id="loginPassword" placeholder="รหัสผ่าน" class="w-full p-3.5 border rounded-lg mb-6 input-field">
            <button id="btnLogin" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-lg transition shadow-lg focus:outline-none">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- Script ควบคุมการทำงานทั้งหมด (รัดกุม 100%) -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx0eE9MmRHQCoWoUfxbHmd1BRP-XoGGTY6TsrdBX0Yadgtogd6TgD5V4BfbGVh3TmxD/exec"; 

        let currentUser = null;
        let qrCodeObj = null;
        let intendedTab = null;
        let uploadedLogo = null;

        // --- ประกาศฟังก์ชันให้ทำงานระดับ Global (แก้บัค Button Onclick) ---
        
        window.apiCall = async function(action, payload = null) {
            try {
                if (payload) {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, ...payload })
                    });
                    return await response.json();
                } else {
                    const response = await fetch(`${API_URL}?action=${action}`);
                    return await response.json();
                }
            } catch (error) {
                return { success: false, message: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้" };
            }
        };

        window.startDictation = function(targetInputId) {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "th-TH";

                const targetElement = document.getElementById(targetInputId);
                const micIcon = targetElement.nextElementSibling;
                micIcon.classList.add('mic-active');

                recognition.start();

                recognition.onresult = function(e) {
                    targetElement.value = e.results[0][0].transcript;
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                };

                recognition.onerror = function(e) {
                    recognition.stop();
                    micIcon.classList.remove('mic-active');
                    Swal.fire({icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถรับเสียงได้ กรุณาตรวจสอบไมโครโฟน', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                }
            } else {
                Swal.fire({icon: 'info', title: 'ไม่รองรับ', text: 'เบราว์เซอร์ของคุณไม่รองรับการพิมพ์ด้วยเสียง (แนะนำ Google Chrome)'});
            }
        };

        window.switchTab = function(tabName) {
            if ((tabName === 'Dashboard' || tabName === 'Bulk') && !currentUser) {
                intendedTab = tabName;
                document.getElementById('pageLogin').classList.add('active');
                return;
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const tabEl = document.getElementById('tab' + tabName);
            if(tabEl) tabEl.classList.remove('hidden');
            if(tabName === 'Dashboard') window.loadDashboard();
        };

        window.closeLogin = function() {
            document.getElementById('pageLogin').classList.remove('active');
            intendedTab = null;
        };

        window.loadDashboard = async function() {
            const stats = await window.apiCall('getStats');
            document.getElementById('statDynamic').textContent = stats.totalDynamic || 0;
            document.getElementById('statLogs').textContent = stats.totalLogs || 0;
        };

        window.generatePromptPayPayload = function(id, amount) {
            let idClean = id.replace(/[^0-9]/g, '');
            let payload = "00020101021129370016A000000677010111";
            if (idClean.length === 10) payload += "01130066" + idClean.substring(1);
            else if (idClean.length === 13) payload += "0213" + idClean;
            else throw "หมายเลขพร้อมเพย์ต้องเป็นเบอร์มือถือ(10หลัก) หรือบัตรประชาชน(13หลัก)";
            payload += "5802TH5303764";
            
            if (amount && parseFloat(amount) > 0) {
                let amtStr = parseFloat(amount).toFixed(2).toString();
                payload += "54" + amtStr.length.toString().padStart(2, '0') + amtStr;
            }
            payload += "6304";
            
            let crc = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                crc ^= payload.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        };

        window.collectAndFormatData = function(type) {
            try {
                if (type === 'url') {
                    const url = document.getElementById('urlInput').value;
                    if(!url) throw "กรุณากรอก URL";
                    return /^https?:\/\//i.test(url) ? url : 'https://' + url;
                } 
                else if (type === 'text') {
                    const txt = document.getElementById('textInput').value;
                    if(!txt) throw "กรุณากรอกข้อความ";
                    return txt;
                } 
                else if (type === 'vcard') {
                    const fn = document.getElementById('vcFname').value;
                    const ln = document.getElementById('vcLname').value;
                    const ph = document.getElementById('vcPhone').value;
                    const em = document.getElementById('vcEmail').value;
                    const org = document.getElementById('vcOrg').value;
                    if(!fn || !ph) throw "กรุณากรอกชื่อและเบอร์โทรศัพท์";
                    return `BEGIN:VCARD\nVERSION:3.0\nN:${ln};${fn}\nFN:${fn} ${ln}\nORG:${org}\nTEL:${ph}\nEMAIL:${em}\nEND:VCARD`;
                } 
                else if (type === 'promptpay') {
                    const pp = document.getElementById('ppId').value;
                    const amt = document.getElementById('ppAmount').value;
                    if(!pp) throw "กรุณากรอกหมายเลขพร้อมเพย์";
                    return window.generatePromptPayPayload(pp, amt);
                } 
                else if (type === 'geo') {
                    const lat = document.getElementById('geoLat').value;
                    const lng = document.getElementById('geoLng').value;
                    if(!lat || !lng) throw "กรุณากรอกละติจูดและลองจิจูดให้ครบ";
                    return `geo:${lat},${lng}`;
                } 
                else if (type === 'event') {
                    const title = document.getElementById('evTitle').value;
                    const start = document.getElementById('evStart').value;
                    const end = document.getElementById('evEnd').value;
                    const loc = document.getElementById('evLocation').value;
                    if(!title || !start || !end) throw "กรุณากรอกข้อมูลการนัดหมายให้ครบ";
                    const formatDT = (dt) => dt.replace(/[-:]/g, '') + '00Z';
                    return `BEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${formatDT(start)}\nDTEND:${formatDT(end)}\nLOCATION:${loc}\nEND:VEVENT`;
                } 
                else if (type === 'wifi') {
                    const ssid = document.getElementById('wifiSSID').value;
                    const pass = document.getElementById('wifiPassword').value;
                    const sec = document.getElementById('wifiSecurity').value;
                    if(!ssid) throw "กรุณากรอกชื่อ WiFi (SSID)";
                    return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
                } 
                else if (type === 'line') {
                    const line = document.getElementById('lineInput').value;
                    if(!line) throw "กรุณากรอก Line ID";
                    return `https://line.me/ti/p/${line}`;
                } 
                else if (type === 'phone') {
                    const phone = document.getElementById('phoneInput').value;
                    if(!phone) throw "กรุณากรอกเบอร์โทรศัพท์";
                    return `tel:${phone}`;
                }
                return '';
            } catch (err) {
                Swal.fire({icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: err});
                return null;
            }
        };

        window.renderQR = function(dataStr) {
            const container = document.getElementById('qrCanvas');
            container.innerHTML = '';
            
            const options = {
                width: 300, height: 300, data: dataStr, margin: 5,
                dotsOptions: { color: document.getElementById('qrColor').value, type: document.getElementById('qrDotStyle').value },
                cornersSquareOptions: { type: "extra-rounded" },
                imageOptions: { crossOrigin: "anonymous", margin: 10 }
            };

            if(uploadedLogo) {
                options.image = uploadedLogo;
                options.dotsOptions.type = 'rounded'; 
            }

            qrCodeObj = new QRCodeStyling(options);
            qrCodeObj.append(container);
            document.getElementById('qrActions').classList.remove('hidden');
        };

        // --- ทำงานเมื่อโหลดหน้าเว็บเสร็จสมบูรณ์ ---
        document.addEventListener("DOMContentLoaded", () => {
            
            // Dark Mode
            document.getElementById('btnDarkMode').addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const icon = document.body.classList.contains('dark-mode') ? 'fa-sun text-yellow-400' : 'fa-moon';
                document.getElementById('btnDarkMode').innerHTML = `<i class="fas ${icon} text-lg"></i>`;
            });

            // การสลับฟอร์ม QR
            document.getElementById('qrType').addEventListener('change', function(e) {
                document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
                const formId = e.target.value + 'Form';
                const targetForm = document.getElementById(formId);
                if(targetForm) targetForm.classList.add('active');
                
                const wrap = document.getElementById('dynamicWrapper');
                const opt = document.getElementById('dynamicOptions');
                const isDyn = document.getElementById('isDynamic');

                if(e.target.value === 'url') {
                    wrap.style.display = 'block';
                } else {
                    wrap.style.display = 'none';
                    if(isDyn) isDyn.checked = false;
                    if(opt) opt.classList.add('hidden');
                }
            });

            // Dynamic Options
            document.getElementById('isDynamic').addEventListener('change', function(e) {
                const opt = document.getElementById('dynamicOptions');
                if (e.target.checked) {
                    opt.classList.remove('hidden');
                } else {
                    opt.classList.add('hidden');
                }
            });

            // อัปโหลดโลโก้
            document.getElementById('logoUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedLogo = event.target.result;
                    document.getElementById('clearLogoBtn').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            });
            
            document.getElementById('clearLogoBtn').addEventListener('click', () => {
                uploadedLogo = null;
                document.getElementById('logoUpload').value = '';
                document.getElementById('clearLogoBtn').classList.add('hidden');
            });

            // เข้าสู่ระบบ
            document.getElementById('btnNavLogin').addEventListener('click', () => {
                document.getElementById('pageLogin').classList.add('active');
            });

            document.getElementById('btnLogin').addEventListener('click', async () => {
                const user = document.getElementById('loginUsername').value;
                const pass = document.getElementById('loginPassword').value;
                if(!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
                
                Swal.showLoading();
                const res = await window.apiCall('login', { username: user, password: pass });
                
                if(res.success) {
                    currentUser = user;
                    window.closeLogin();
                    document.getElementById('btnNavLogin').classList.add('hidden');
                    document.getElementById('btnNavLogout').classList.remove('hidden');
                    
                    Swal.fire({icon: 'success', title: 'ยินดีต้อนรับ', text: res.name, timer: 1500, showConfirmButton: false});
                    
                    if(intendedTab) {
                        window.switchTab(intendedTab);
                        intendedTab = null;
                    }
                } else {
                    Swal.fire('ข้อผิดพลาด', res.message, 'error');
                }
            });

            // ออกจากระบบ
            document.getElementById('btnNavLogout').addEventListener('click', () => {
                currentUser = null;
                document.getElementById('btnNavLogin').classList.remove('hidden');
                document.getElementById('btnNavLogout').classList.add('hidden');
                window.switchTab('Generator'); 
                Swal.fire({icon: 'info', title: 'ออกจากระบบแล้ว', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500});
            });

            // ปุ่มสร้าง QR Code
            document.getElementById('btnGenerate').addEventListener('click', async () => {
                const type = document.getElementById('qrType').value;
                const isDynamic = document.getElementById('isDynamic').checked;
                
                if (isDynamic && !currentUser) {
                    intendedTab = null;
                    document.getElementById('pageLogin').classList.add('active');
                    Swal.fire({icon: 'info', title: 'สำหรับเจ้าหน้าที่', text: 'กรุณาเข้าสู่ระบบก่อนสร้าง Dynamic QR'});
                    return;
                }

                const dataStr = window.collectAndFormatData(type);
                if(!dataStr) return; 

                if (isDynamic) {
                    Swal.showLoading();
                    const expiry = document.getElementById('dynExpiry').value;
                    const dept = document.getElementById('dynDepartment').value;
                    
                    const res = await window.apiCall('saveDynamic', { 
                        url: dataStr, user: currentUser, expiry: expiry, department: dept 
                    });
                    
                    if (res.success) {
                        window.renderQR(res.url); 
                        Swal.close();
                    } else {
                        Swal.fire('Error', res.message, 'error');
                    }
                } else {
                    window.renderQR(dataStr);
                }
            });

            // ปุ่มโหลดและพิมพ์
            document.getElementById('btnDownload').addEventListener('click', () => { if(qrCodeObj) qrCodeObj.download({ extension: "png" }); });
            document.getElementById('btnDownloadSvg').addEventListener('click', () => { if(qrCodeObj) qrCodeObj.download({ extension: "svg" }); });
            document.getElementById('btnPrint').addEventListener('click', () => { window.print(); });

            // ปุ่มดึงข้อมูลกลุ่ม
            document.getElementById('btnLoadBulk').addEventListener('click', async () => {
                Swal.showLoading();
                const data = await window.apiCall('getBulk');
                const container = document.getElementById('bulkResults');
                container.innerHTML = '';
                
                if(data && data.length > 0) {
                    data.forEach((row, index) => {
                        if(!row[0]) return;
                        const div = document.createElement('div');
                        div.className = "border p-4 rounded-xl bg-white text-center shadow-sm dark:bg-gray-800 dark:border-gray-600";
                        container.appendChild(div);

                        const bulkQr = new QRCodeStyling({ width: 120, height: 120, data: row[0], margin: 5 });
                        bulkQr.append(div);
                        
                        const label = document.createElement('p');
                        label.className = "text-xs mt-3 font-bold truncate text-gray-800 dark:text-gray-200";
                        label.textContent = row[2] || 'QR_' + (index+1);
                        div.appendChild(label);
                    });
                } else {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">ไม่พบข้อมูลใน Google Sheets</p>';
                }
                Swal.close();
            });
        });
    </script>
</body>
