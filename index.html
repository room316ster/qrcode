<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Enterprise QR Code Pro (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        body { background: #f3f4f6; color: #1f2937; font-family: sans-serif; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .glass { background: white; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 2rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- หน้า Login -->
    <div id="pageLogin" class="page-section active flex-grow flex items-center justify-center p-4">
        <div class="glass w-full max-w-md text-center">
            <i class="fas fa-qrcode text-6xl text-purple-600 mb-4"></i>
            <h1 class="text-2xl font-bold mb-6">ระบบจัดการ QR Code องค์กร</h1>
            <input type="text" id="loginUsername" placeholder="ชื่อผู้ใช้งาน" class="w-full p-3 border rounded mb-4">
            <input type="password" id="loginPassword" placeholder="รหัสผ่าน" class="w-full p-3 border rounded mb-6">
            <button id="btnLogin" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded transition">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- หน้า Application หลัก -->
    <div id="pageApp" class="page-section flex-grow p-4 md:p-8">
        <nav class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow">
            <div class="font-bold text-xl"><i class="fas fa-qrcode text-purple-600 mr-2"></i>QR Pro</div>
            <div class="flex space-x-4 text-sm md:text-base">
                <button onclick="switchTab('Generator')" class="font-medium hover:text-purple-600">สร้าง QR</button>
                <button onclick="switchTab('Dashboard')" class="font-medium hover:text-purple-600">สถิติ</button>
                <button onclick="switchTab('Bulk')" class="font-medium hover:text-purple-600">กลุ่ม (Bulk)</button>
                <button id="btnLogout" class="font-medium text-red-500 hover:text-red-700"><i class="fas fa-sign-out-alt"></i> ออก</button>
            </div>
        </nav>

        <!-- โหมดสร้าง QR Code -->
        <div id="tabGenerator" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass">
                <h2 class="text-xl font-bold mb-4">ตั้งค่า QR Code</h2>
                <div class="mb-4">
                    <label class="block mb-2 text-sm font-bold">ข้อมูล (URL หรือ ข้อความ)</label>
                    <input type="text" id="qrData" class="w-full p-3 border rounded" placeholder="https://...">
                </div>
                
                <div class="mb-4">
                    <label class="flex items-center text-sm font-bold text-blue-600">
                        <input type="checkbox" id="isDynamic" class="mr-2 h-5 w-5">
                        เปิดใช้งาน Dynamic QR (แก้ไขปลายทางได้)
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">สีหลัก</label>
                        <input type="color" id="qrColor" value="#000000" class="w-full h-10">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">สไตล์จุด</label>
                        <select id="qrDotStyle" class="w-full p-2 border rounded">
                            <option value="square">สี่เหลี่ยม</option>
                            <option value="dots">กลม (Dots)</option>
                        </select>
                    </div>
                </div>

                <button id="btnGenerate" class="w-full bg-purple-600 text-white font-bold py-3 rounded mt-4"><i class="fas fa-magic mr-2"></i> ประมวลผลภาพ</button>
            </div>

            <div class="glass flex flex-col items-center justify-center">
                <h2 class="text-xl font-bold mb-4 w-full text-left">ผลลัพธ์</h2>
                <div id="qrCanvas" class="bg-white p-4 rounded-xl shadow-inner min-h-[300px] flex items-center justify-center"></div>
                <div id="qrActions" class="mt-4 hidden">
                    <button id="btnDownload" class="bg-green-500 text-white px-4 py-2 rounded font-bold"><i class="fas fa-download"></i> ดาวน์โหลด</button>
                </div>
            </div>
        </div>

        <!-- โหมด Dashboard -->
        <div id="tabDashboard" class="tab-content hidden glass">
            <h2 class="text-2xl font-bold mb-6"><i class="fas fa-chart-pie mr-2"></i> แดชบอร์ดสรุปสถิติ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-blue-100 p-6 rounded-xl border border-blue-200">
                    <h3 class="text-blue-800 font-bold text-lg">Dynamic QR ทั้งหมด</h3>
                    <p id="statDynamic" class="text-4xl font-black text-blue-600 mt-2">...</p>
                </div>
                <div class="bg-green-100 p-6 rounded-xl border border-green-200">
                    <h3 class="text-green-800 font-bold text-lg">ประวัติการใช้งานระบบ (Logs)</h3>
                    <p id="statLogs" class="text-4xl font-black text-green-600 mt-2">...</p>
                </div>
            </div>
            <button onclick="loadDashboard()" class="mt-6 bg-gray-200 px-4 py-2 rounded hover:bg-gray-300"><i class="fas fa-sync-alt"></i> โหลดข้อมูลใหม่</button>
        </div>

        <!-- โหมด Bulk -->
        <div id="tabBulk" class="tab-content hidden glass">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-layer-group mr-2"></i> สร้าง QR Code แบบกลุ่ม</h2>
            <button id="btnLoadBulk" class="bg-blue-600 text-white px-4 py-2 rounded font-bold mb-4"><i class="fas fa-cloud-download-alt"></i> โหลดข้อมูลจาก Google Sheets</button>
            <div id="bulkResults" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔴 นำ URL ของ Web App ที่ได้จาก Google Apps Script มาใส่ตรงนี้ 🔴
        // ==========================================
        const API_URL = "ใส่_URL_WEB_APP_ที่นี่"; 

        let currentUser = null;
        let qrCodeObj = null;

        // ฟังก์ชันตัวกลางสำหรับยิง API ไปหา Google Apps Script
        async function apiCall(action, payload = null) {
            try {
                if (payload) {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        // ส่งเป็น text/plain เพื่อหลีกเลี่ยงปัญหา CORS บน GitHub Pages
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, ...payload })
                    });
                    return await response.json();
                } else {
                    const response = await fetch(`${API_URL}?action=${action}`);
                    return await response.json();
                }
            } catch (error) {
                console.error("API Error:", error);
                return { success: false, message: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้" };
            }
        }

        // ระบบสลับหน้า
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab' + tabName).classList.remove('hidden');
            if(tabName === 'Dashboard') loadDashboard();
        }

        // ระบบ Login ด้วย fetch
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;
            if(!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
            
            Swal.showLoading();
            const res = await apiCall('login', { username: user, password: pass });
            
            if(res.success) {
                currentUser = user;
                document.getElementById('pageLogin').classList.remove('active');
                document.getElementById('pageApp').classList.add('active');
                Swal.fire({icon: 'success', title: 'ยินดีต้อนรับ', text: res.name, timer: 1500});
            } else {
                Swal.fire('ข้อผิดพลาด', res.message, 'error');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('pageApp').classList.remove('active');
            document.getElementById('pageLogin').classList.add('active');
        });

        // ระบบสร้าง QR
        document.getElementById('btnGenerate').addEventListener('click', async () => {
            const dataInput = document.getElementById('qrData').value;
            const isDynamic = document.getElementById('isDynamic').checked;
            
            if(!dataInput) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูล', 'warning');

            if(isDynamic) {
                Swal.showLoading();
                const res = await apiCall('saveDynamic', { url: dataInput, user: currentUser });
                if (res.success) {
                    renderAdvancedQR(res.url); // res.url คือลิงก์ Web App + ?id=
                    Swal.close();
                }
            } else {
                renderAdvancedQR(dataInput);
            }
        });

        function renderAdvancedQR(dataStr) {
            const container = document.getElementById('qrCanvas');
            container.innerHTML = '';
            
            qrCodeObj = new QRCodeStyling({
                width: 300, height: 300, data: dataStr, margin: 10,
                dotsOptions: { color: document.getElementById('qrColor').value, type: document.getElementById('qrDotStyle').value },
                cornersSquareOptions: { type: "extra-rounded" }
            });

            qrCodeObj.append(container);
            document.getElementById('qrActions').classList.remove('hidden');
        }

        document.getElementById('btnDownload').addEventListener('click', () => {
            if(qrCodeObj) qrCodeObj.download({ extension: "png" });
        });

        // โหลด Dashboard
        async function loadDashboard() {
            const stats = await apiCall('getStats');
            document.getElementById('statDynamic').textContent = stats.totalDynamic || 0;
            document.getElementById('statLogs').textContent = stats.totalLogs || 0;
        }

        // โหลดข้อมูล Bulk
        document.getElementById('btnLoadBulk').addEventListener('click', async () => {
            Swal.showLoading();
            const data = await apiCall('getBulk');
            const container = document.getElementById('bulkResults');
            container.innerHTML = '';
            
            if(data.length > 0) {
                data.forEach((row, index) => {
                    if(!row[0]) return;
                    const div = document.createElement('div');
                    div.className = "border p-4 rounded bg-white text-center shadow-sm";
                    container.appendChild(div);

                    const bulkQr = new QRCodeStyling({ width: 120, height: 120, data: row[0], margin: 5 });
                    bulkQr.append(div);
                    
                    const label = document.createElement('p');
                    label.className = "text-xs mt-2 font-bold truncate";
                    label.textContent = row[2] || 'QR_' + (index+1);
                    div.appendChild(label);
                });
            } else {
                container.innerHTML = '<p class="col-span-4 text-center text-gray-500">ไม่พบข้อมูลใน Google Sheets</p>';
            }
            Swal.close();
        });
    </script>
</body>
</html>
